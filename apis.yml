- name: Arbitrum Nova JSON-RPC
  description: >-
    Public Ethereum JSON-RPC endpoint for Arbitrum Nova (chain ID 42170), the AnyTrust
    chain optimized for low-cost, high-throughput applications.
  humanURL: https://docs.arbitrum.io/build-decentralized-apps/reference/node-providers
  baseURL: https://nova.arbitrum.io/rpc
