aid: offchain-labs
name: Offchain Labs
description: >-
  Offchain Labs (now operating as "Offchain") is the research-and-engineering company
  behind Arbitrum, one of the leading Ethereum Layer 2 scaling ecosystems, and Prysm, an
  Ethereum consensus client that powers a large share of the network. Its technology
  stack includes Arbitrum Nitro (the rollup node software), Arbitrum Stylus (a framework
  for writing smart contracts in Rust, C, and C++ compiled to WebAssembly), the Arbitrum
  Orbit / Arbitrum chains SDK for launching app-specific chains, and BoLD for permissionless
  dispute resolution. For developers the surface is Ethereum JSON-RPC endpoints for Arbitrum
  One, Nova, and Sepolia, plus first-party TypeScript, Rust, Go, and Solidity SDKs, the
  cargo-stylus CLI, and extensive documentation at docs.arbitrum.io.
