  description: >-
    Public Ethereum JSON-RPC endpoint for Arbitrum One (chain ID 42161), the flagship
    Arbitrum Layer 2 rollup. Supports the standard Ethereum JSON-RPC method set plus
    Arbitrum-specific precompiles and the NodeInterface.
  humanURL: https://docs.arbitrum.io/build-decentralized-apps/reference/node-providers
